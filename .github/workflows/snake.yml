name: Generate snake animation & stats

on:
  schedule:
    - cron: "0 */12 * * *" # regenera a cada 12h
  workflow_dispatch:       # botão "Run workflow" manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Cards de stats gerados aqui mesmo (sem depender da instância pública da Vercel).
      # Rodam ANTES da cobrinha: o container do snk cria dist/ como root e bloqueia escrita depois.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&bg_color=1A1024&title_color=FF6EC7&icon_color=C77DFF&include_all_commits=true&locale=pt-br
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=6&theme=radical&hide_border=true&bg_color=1A1024&title_color=FF6EC7&locale=pt-br
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Cards no estilo "profile summary" (perfil + gráfico, linguagens, commits por hora, stats).
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: radical
          TIME_ZONE: America/Sao_Paulo
          NAME: Nícolas Codognotto
          AUTO_PUSH: false

      - name: Copy summary cards into dist (with profile background color)
        run: |
          mkdir -p dist/summary
          cp profile-summary-card-output/radical/*.svg dist/summary/
          sed -i 's/#141321/#1A1024/gI' dist/summary/*.svg
          ls dist/summary

      - name: Generate snake SVGs from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C77DFF&color_dots=#1A1024,#3B1F5C,#6B21A8,#A855F7,#FF6EC7
            dist/github-snake-purple.svg?color_snake=#6B21A8&color_dots=#EBEDF0,#E9D5FF,#C084FC,#9333EA,#581C87

      - name: Push SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
