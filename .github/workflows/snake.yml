name: Generate snake animation & stats

on:
  schedule:
    - cron: "0 */12 * * *" # regenera a cada 12h
  workflow_dispatch:       # botão "Run workflow" manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Cards de analytics gerados aqui mesmo (sem depender de instâncias públicas da Vercel).
      # Rodam ANTES da cobrinha: o container do snk cria dist/ como root e bloqueia escrita depois.
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: radical
          UTC_OFFSET: -3
          NAME: Nícolas Codognotto
          AUTO_PUSH: false

      - name: Copy summary cards into dist (with profile background color)
        run: |
          mkdir -p dist/summary
          cp profile-summary-card-output/radical/*.svg dist/summary/
          sed -i -e 's/#141321/#1A1024/gI' -e 's/#f8d847/#C77DFF/gI' dist/summary/*.svg
          ls dist/summary

      - name: Generate snake SVGs from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C77DFF&color_dots=#1A1024,#3B1F5C,#6B21A8,#A855F7,#FF6EC7
            dist/github-snake-purple.svg?color_snake=#6B21A8&color_dots=#EBEDF0,#E9D5FF,#C084FC,#9333EA,#581C87

      - name: Push SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
